services:

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DOCS_AGENT_DB_PASS:?brak DOCS_AGENT_DB_PASS}
      POSTGRES_DB: docs_agent
      POSTGRES_USER: docs_agent_user
    ports: 
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs_agent_user -d docs_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata: